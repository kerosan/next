type User {
  id: Int
  smId: String
  email: String
  name: String
  phone: String
  addressId: Int
  address: Address
  deviceId: Int
  device: Device
  balance: Float
}

type UserPageResult {
  list: [User!]!
  total: Int!
}

input CreateUserInput {
  smId: String
  email: String
  name: String
  phone: String
  # address: String
  addressId: Int
  # device: String
  deviceId: Int
}

input UpdateUserInput {
  id: Int!
  smId: String
  email: String
  name: String
  phone: String
  # address: String
  addressId: Int
  # device: String
  deviceId: Int
}

type Address {
  id: Int
  address: String
  city: String
  zipCode: String
}

type AddressPageResult {
  list: [Address!]!
  total: Int!
}

input CreateAddressInput {
  address: String!
  city: String
  zipCode: String
}

input UpdateAddressInput {
  id: Int!
  address: String!
  city: String
  zipCode: String
}

type Device {
  id: Int!
  userId: Int
  user: User
  serviceId: Int
  service: Service
  meterNumber: String
  initialValue: Float!
  startDate: String!
  endDate: String
  readings: [MeterReading!]!
}

type DevicePageResult {
  list: [Device!]!
  total: Int!
}

input CreateDeviceInput {
  userId: Int
  serviceId: Int
  meterNumber: String
  initialValue: Float!
  startDate: String!
  endDate: String
}

input UpdateDeviceInput {
  id: Int!
  userId: Int
  serviceId: Int
  meterNumber: String
  initialValue: Float
  startDate: String
  endDate: String
}

type Billing {
  id: Int!
  userId: Int!
  user: User!
  deviceId: Int!
  device: Device!
  tariffId: Int!
  tariff: Tariff!
  billingPeriod: String!
  previousReading: Float!
  currentReading: Float!
  consumption: Float!
  amount: Float!
  dueDate: String!
  isPaid: Boolean!
}

type BillingPageResult {
  list: [Billing!]!
  total: Int!
}

input CreateBillingInput {
  userId: Int!
  deviceId: Int!
  tariffId: Int!
  billingPeriod: String!
  previousReading: Float!
  currentReading: Float!
  dueDate: String!
}

input UpdateBillingInput {
  id: Int!
  billingPeriod: String
  previousReading: Float
  currentReading: Float
  dueDate: String
  isPaid: Boolean
}

type Settings {
  tariff: [Tariff!]!
}

type Service {
  id: Int!
  name: String!
  unit: String!
  tariffs: [Tariff!]!
  devices: [Device!]!
}

type ServicePageResult {
  list: [Service!]!
  total: Int!
}

input CreateServiceInput {
  name: String!
  unit: String!
}

input UpdateServiceInput {
  id: Int!
  name: String
  unit: String
}

type MeterReading {
  id: Int!
  deviceId: Int!
  device: Device!
  readingDate: String!
  value: Float!
  consumption: Float
  notes: String
}

type MeterReadingPageResult {
  list: [MeterReading!]!
  total: Int!
}

input CreateMeterReadingInput {
  deviceId: Int!
  readingDate: String!
  value: Float!
  notes: String
}

type Payment {
  id: Int!
  userId: Int!
  user: User!
  billingId: Int
  billing: Billing
  amount: Float!
  paymentMethod: String!
  paymentDate: String!
  reference: String
  notes: String
}

type PaymentPageResult {
  list: [Payment!]!
  total: Int!
}

input CreatePaymentInput {
  userId: Int!
  billingId: Int
  amount: Float!
  paymentMethod: String!
  paymentDate: String!
  reference: String
  notes: String
}

type ConsumptionReading {
  period: String!
  value: Float!
  consumption: Float
  service: String!
}

type ConsumptionReport {
  userId: Int!
  userName: String!
  totalConsumption: Float!
  averageMonthlyConsumption: Float!
  readings: [ConsumptionReading!]!
}

type DebtUser {
  userId: Int!
  userName: String!
  totalDebt: Float!
  dueCount: Int!
  overdueCount: Int!
}

type DebtReport {
  totalDebt: Float!
  overdueDebt: Float!
  billingCount: Int!
  overdueCount: Int!
  users: [DebtUser!]!
}

type MonthlyRevenueData {
  month: String!
  billed: Float!
  paid: Float!
  collected: Float!
}

type PaymentMethodStats {
  method: String!
  count: Int!
  amount: Float!
}

type RevenueReport {
  totalRevenue: Float!
  totalBilled: Float!
  totalPaid: Float!
  collectionRate: Float!
  monthlyData: [MonthlyRevenueData!]!
  paymentMethods: [PaymentMethodStats!]!
}

type Tariff {
  id: Int!
  serviceId: Int!
  service: Service!
  name: String!
  price: Float!
  startDate: String!
  endDate: String
}

input CreateTariffInput {
  serviceId: Int!
  name: String!
  price: Float!
  startDate: String!
  endDate: String
}

input UpdateTariffInput {
  id: Int!
  serviceId: Int
  name: String
  price: Float
  startDate: String
  endDate: String
}

type Query {
  address(take: Int!, skip: Int!): AddressPageResult
  billing(take: Int!, skip: Int!): BillingPageResult
  device(take: Int!, skip: Int!): DevicePageResult
  users(take: Int!, skip: Int!): UserPageResult
  searchAddress(text: String): [Address]!
  searchDevice(text: String): [Device]!
  settings: Settings!
  services(take: Int!, skip: Int!): ServicePageResult
  readings(deviceId: Int!, take: Int!, skip: Int!): MeterReadingPageResult
  payments(take: Int!, skip: Int!): PaymentPageResult
  searchPayment(reference: String): [Payment]!
  unpaidBillings(userId: Int!, take: Int!, skip: Int!): BillingPageResult
  consumptionReport(userId: Int!, months: Int!): ConsumptionReport
  debtReport: DebtReport
  revenueReport(monthsBack: Int!): RevenueReport
}

type Mutation {
  createUser(user: CreateUserInput): User
  updateUser(user: UpdateUserInput): User
  deleteUser(userId: Int): Int

  createAddress(address: CreateAddressInput!): Address
  updateAddress(address: UpdateAddressInput!): Address
  deleteAddress(addressId: Int): Int

  createDevice(device: CreateDeviceInput!): Device
  updateDevice(device: UpdateDeviceInput!): Device
  deleteDevice(deviceId: Int): Int

  createBilling(billing: CreateBillingInput!): Billing
  updateBilling(billing: UpdateBillingInput!): Billing
  deleteBilling(billingId: Int): Int

  createTariff(tariff: CreateTariffInput!): Tariff
  updateTariff(tariff: UpdateTariffInput!): Tariff
  deleteTariff(tariffId: Int): Int

  createService(service: CreateServiceInput!): Service
  updateService(service: UpdateServiceInput!): Service
  deleteService(serviceId: Int): Int

  createReading(reading: CreateMeterReadingInput!): MeterReading
  deleteReading(readingId: Int): Int

  createPayment(payment: CreatePaymentInput!): Payment
  deletePayment(paymentId: Int): Int
}
